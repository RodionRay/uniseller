name: CI

on:
  push:
    branches: [main, master, dev, "task/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Worker Python unit tests (only Telethon needed, test_resolve_blind imports it)
        run: |
          python3 -m pip install --quiet "$(grep -i "^telethon==" telegram-worker/requirements.txt)"
          python3 -m unittest discover -s telegram-worker/tests
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
